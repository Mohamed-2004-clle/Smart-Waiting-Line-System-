services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-queue-backend
    command: npm start
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: smart_queue_azure_demo_secret_2026
      FRONTEND_BASE_URL: http://20.91.188.115:5173
      DEMO_TENANT_ID: tenant-001
      RESET_DEMO_ON_START: "true"
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-queue-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://20.91.188.115:5000/api
      VITE_SOCKET_URL: http://20.91.188.115:5000
    depends_on:
      - backend
    restart: unless-stopped