services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-queue-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: change_this_secret_for_test
      FRONTEND_BASE_URL: http://localhost:5173
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-queue-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped
